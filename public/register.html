<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Job Market</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-slate));
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .register-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .register-card {
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h2 {
            font-size: 30px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-main), var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Role Selector Tabs */
        .role-tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 25px;
        }

        .role-tab {
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            text-align: center;
        }

        .role-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
        }

        .input-icon-container {
            position: relative;
        }

        .input-icon-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .input-icon-container input {
            padding-left: 45px;
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn btn-secondary btn-sm back-home">
        <i class="fa-solid fa-arrow-left"></i> Home
    </a>

    <div class="register-container">
        <div class="card register-card">
            
            <div class="register-header">
                <h2>Create Account</h2>
                <p>Register as a Job Seeker or Recruiter</p>
            </div>

            <!-- Role Selector -->
            <div class="role-tabs">
                <button type="button" class="role-tab active" onclick="setRole('User', this)">Job Seeker</button>
                <button type="button" class="role-tab" onclick="setRole('Recruiter', this)">Recruiter</button>
            </div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <input type="hidden" id="selected-role" value="User">

                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <div class="input-icon-container">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="reg-name" class="form-control" placeholder="e.g. John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <div class="input-icon-container">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="reg-email" class="form-control" placeholder="e.g. john@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-icon-container">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="4" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px; height: 48px;">
                    Create Account <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>

            <div class="form-footer">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Redirect if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const user = getSessionUser();
            if (user) {
                window.location.href = 'index.html';
            }
        });

        function setRole(role, btn) {
            document.getElementById('selected-role').value = role;
            
            // Toggle active state
            document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        }

        async function handleRegister(e) {
            e.preventDefault();
            
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('selected-role').value;

            try {
                const result = await apiRequest('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ name, email, password, role })
                });

                if (result.success) {
                    showNotification("Account created successfully! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = `login.html`;
                    }, 1200);
                }
            } catch (err) {
                showNotification(err.message, "error");
            }
        }
    </script>
</body>
</html>
